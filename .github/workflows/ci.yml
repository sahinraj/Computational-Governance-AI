name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Validate GovernanceBench and evaluation
        run: python -m evaluation.run_benchmark --check
      - name: Validate conformance protocol
        run: python -m conformance.runner --check
      - name: Validate Phase 3 assurance
        run: python -m evaluation.model_assurance --check --traces 1000
      - name: Validate release CLI
        run: python -m governance validate-policy examples/phase3-policy.law --role ReleaseManager --role SecurityLead --role FinanceLead
      - name: Validate CLI conformance
        run: python -m governance conformance
      - name: Validate failure taxonomy containment
        run: python -m evaluation.failure_harness --check
      - name: Validate runtime performance envelope
        run: python -m evaluation.performance --check --iterations 250
