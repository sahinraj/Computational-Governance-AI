[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-governance"
version = "0.2.0"
description = "Runtime governance reference implementation and runtime-agnostic benchmark for autonomous systems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sahin Raj"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["governance*", "governancebench*", "evaluation*"]

[tool.setuptools.package-data]
governancebench = ["data/*.json"]
